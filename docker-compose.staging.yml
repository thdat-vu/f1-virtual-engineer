# ──────────────────────────────────────────────────────────────────────
# How to bring this up
# ──────────────────────────────────────────────────────────────────────
# Easiest: `make redis-up` from the repo root. It auto-detects which
# compose flavor you have (`docker compose` plugin vs standalone
# `docker-compose`) and reads backend/.env for you.
#
# Manual invocation, if you'd rather not use make:
#
#   docker-compose --env-file backend/.env -f docker-compose.staging.yml up -d redis
#   # or, if you have the v2 plugin instead of the standalone binary:
#   docker compose  --env-file backend/.env -f docker-compose.staging.yml up -d redis
#
# Why the --env-file flag is non-optional: compose's auto-loaded `.env`
# lives next to this file at the repo root, NOT at backend/.env. The
# redis service interpolates REDIS_PASSWORD at compose-parse time
# (before any container starts). Without --env-file you'll see:
#
#   error while interpolating services.redis.environment.REDIS_PASSWORD:
#   required variable REDIS_PASSWORD is missing a value
#
# The `env_file:` keys on individual services (backend, frontend) only
# inject env vars INTO those containers at runtime — they do nothing
# for top-level interpolation like ${REDIS_PASSWORD:?...}.
# ──────────────────────────────────────────────────────────────────────

services:
  # ──────────────────────────────────────────────────────────────────────
  # Redis — L2 cache + future Celery broker/result backend (#100, #139).
  #
  # Hardening checklist embedded in this config:
  # 1. NO host port mapping. Only the internal docker network can reach
  #    6379. If you ever need redis-cli from the host, prefer
  #    `docker compose exec redis redis-cli -a "$REDIS_PASSWORD"` — that
  #    keeps the port off the public interface.
  # 2. requirepass is mandatory. Backend connects with a URL that includes
  #    the password (REDIS_URL=redis://:PASSWORD@redis:6379/0). With no
  #    password and a public bind, Redis is trivially RCE-able via
  #    `CONFIG SET dir /var/spool/cron` → cron entry → root.
  # 3. Cache-only persistence: `save ""` + `appendonly no`. Disk usage
  #    stays at zero for this service — a hard requirement on the disk-
  #    constrained VPS. If we ever queue jobs through Redis, revisit:
  #    Celery uses Redis for results, those benefit from persistence.
  # 4. maxmemory + allkeys-lru — hard ceiling so a runaway cache key
  #    can't OOM-kill the VPS. LRU eviction beats refusing writes for a
  #    cache workload.
  # 5. `protected-mode yes` is the implicit default; we leave it on.
  # 6. Renamed CONFIG to a hard-to-guess token so even an authed attacker
  #    can't flip persistence + dump RDB to a writable path.
  # ──────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The whole config is in `command` so it lives next to the rest of
    # this file; no separate redis.conf to keep in sync.
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in backend/.env}"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      # rename-command takes TWO tokens after the flag: original name +
      # new name. Each goes in its own list item — quoting them as a
      # single "CONFIG NEWNAME" string makes redis-server parse it as
      # one ill-formed directive and refuse to start.
      - "--rename-command"
      - "CONFIG"
      - "${REDIS_CONFIG_RENAME:-CONFIG_a4d2}"
      - "--rename-command"
      - "FLUSHALL"
      - "${REDIS_FLUSHALL_RENAME:-FLUSHALL_a4d2}"
      - "--rename-command"
      - "FLUSHDB"
      - "${REDIS_FLUSHDB_RENAME:-FLUSHDB_a4d2}"
    healthcheck:
      # AUTH first, then PING — verifies both that the server is up AND
      # that the password handshake works. A bare PING returns NOAUTH on
      # a hardened server and would still report "healthy."
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      # Used by the healthcheck only; the server itself reads --requirepass.
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in backend/.env}"
    # No `ports:` block on purpose — see hardening note 1 above.

  # ──────────────────────────────────────────────────────────────────────
  # RabbitMQ — Celery broker for the async task pipeline (#139).
  #
  # Hardening checklist:
  # 1. NO host port mapping for 5672 (AMQP) or 15672 (management UI). The
  #    docker network is the only path to either. If you need the UI for
  #    a demo, tunnel it: `ssh -L 15672:localhost:15672 vps`.
  # 2. Default `guest` user is left at its built-in `loopback_users.guest`
  #    setting (only reachable from localhost inside the container). We
  #    don't disable that — every tutorial that does is wrong.
  # 3. A dedicated `apex` user + `apex` vhost are created on first boot
  #    via the RABBITMQ_DEFAULT_* env vars. The Celery app + worker only
  #    ever talk through this user.
  # 4. Persistent volume so messages survive a container restart. RabbitMQ
  #    tries to keep this lean (queue messages only, no payload bloat),
  #    but watch disk if traffic spikes — see docs/INFRA_HARDENING.md Q4.
  # 5. Healthcheck uses `rabbitmq-diagnostics check_running` which is the
  #    cheapest one Erlang exposes — `ping` allocates more.
  # ──────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "apex"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in backend/.env}"
      RABBITMQ_DEFAULT_VHOST: "apex"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────────────────
  # Celery worker — consumes the apex vhost, runs registered tasks.
  #
  # Same image as backend (no rebuild), CMD swapped to celery. The
  # `--without-heartbeat --without-mingle --without-gossip` flags trim
  # ~30MB of resident memory per worker by skipping cluster-discovery
  # protocols we don't use (single-node deploy).
  # ──────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    command:
      - "celery"
      - "-A"
      - "tasks"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
      - "--without-heartbeat"
      - "--without-mingle"
      - "--without-gossip"
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_API_BASE_URL: /api
    env_file:
      - frontend/.env.local
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  rabbitmq-data:
