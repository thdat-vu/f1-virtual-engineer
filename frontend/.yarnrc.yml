# Yarn Berry config (#171). PnP is the default but breaks Next.js 16 +
# Turbopack today — Turbopack's resolver doesn't read .pnp.cjs. Falling
# back to a plain node_modules tree gets us deterministic installs +
# yarn.lock without losing dev-server compatibility.
nodeLinker: node-modules

# Skip the global mirror for now — repo doesn't track .yarn/cache, and
# the hoisted node_modules layout is what next/turbopack expects.
enableGlobalCache: false
